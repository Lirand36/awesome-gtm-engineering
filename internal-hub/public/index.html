<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Internal Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%228%22 fill=%22%233b5bdb%22/%3E%3Ctext x=%2216%22 y=%2222%22 font-size=%2218%22 font-family=%22sans-serif%22 font-weight=%22700%22 fill=%22white%22 text-anchor=%22middle%22%3EH%3C/text%3E%3C/svg%3E" />

<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-mark">H</span>
        <div>
          <div class="brand-name">Internal Hub</div>
          <div class="brand-sub">Sales &amp; Support workspace</div>
        </div>
      </div>

      <nav class="nav">
        <a href="#/customers" data-nav="customers"><span class="ico">◧</span> Customers</a>
        <a href="#/inbox" data-nav="inbox"><span class="ico">✉</span> Inbox <span class="badge" id="inbox-badge" hidden></span></a>
        <a href="#/activity" data-nav="activity"><span class="ico">⇄</span> Integration log</a>
        <a href="#/connections" data-nav="connections"><span class="ico">⚙</span> Connections</a>
      </nav>

      <div class="sidebar-foot">
        <label class="muted small" for="actor">Signed in as</label>
        <select id="actor">
          <option>Noa L. (Sales)</option>
          <option>Ron (Support)</option>
          <option>Daniel R. (Account Manager)</option>
        </select>
      </div>
    </aside>

    <main id="view" class="main" aria-live="polite"></main>
  </div>

  <div id="toasts" class="toasts"></div>
  <dialog id="modal"></dialog>

  <script src="app.js" type="module"></script>
</body>
</html>
